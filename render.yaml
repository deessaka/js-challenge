services:
  - type: web
    name: codojo
    plan: free
    runtime: node
    # Adonis validates its environment during the build; these placeholders are build-only and are never used at runtime.
    buildCommand: APP_KEY="32chars_dummy_key_for_build_1" GITHUB_CLIENT_ID="dummy" GITHUB_CLIENT_SECRET="dummy" REDIS_HOST="localhost" REDIS_PORT="6379" npm ci --include=dev && npm run build && npx vite build
    # Render Free does not provide preDeployCommand. Migrations are idempotent and run before the server.
    # Run the seed manually once from the Render Shell: cd build && node bin/console.js db:seed
    startCommand: cd build && node bin/console.js migration:run --force && exec node bin/server.js
    healthCheckPath: /health
    envVars:
      - key: TZ
        value: UTC
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: APP_KEY
        generateValue: true
      - key: DOMAIN
        value: https://codojo.ekodevs.com
      - key: PUBLIC_APP_URL
        value: https://codojo.ekodevs.com
      - key: NODE_ENV
        value: production
      - key: SESSION_DRIVER
        value: cookie
      # Conservative default for the 512 MB free instance; raise only after load testing.
      - key: CODE_EXECUTION_CONCURRENCY
        value: 2
      # Database configuration
      # These values are managed in Render and point to the Neon project.
      # Keep them out of Blueprint database bindings so Render cannot restore the
      # suspended Render Postgres instance on a future sync.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false
      # GitHub OAuth
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OAUTH_GITHUB_CALLBACK_URL
        value: https://codojo.ekodevs.com/oauth/github/callback
      # Redis configuration
      - key: REDIS_HOST
        fromService:
          type: redis
          name: codojo-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: codojo-redis
          property: port
      - key: REDIS_PASSWORD
        value: ''
      # Email configuration
      - key: MAIL_DRIVER
        value: resend
      - key: MAIL_FROM_ADDRESS
        value: noreply@notifications.ekodevs.com
      - key: MAIL_FROM_NAME
        value: Codojo
      - key: MAIL_REPLY_TO
        value: noreply@notifications.ekodevs.com
      - key: RESEND_API_KEY
        sync: false
      # SMTP configuration
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
  - type: redis
    name: codojo-redis
    plan: free
    # Empty allowlist = no external access, private network only (Render
    # blocks all public connections when this is []; it does not open them).
    ipAllowList: []
