name: 🐛 Bug report
description: Signaler un comportement incorrect
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Merci de remplir ce formulaire pour nous aider à reproduire le bug.
        French and English reports are welcome. Never include tokens, passwords or real user data.
  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Qu'est-ce qui se passe ? Qu'est-ce qui devrait se passer ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Lancer `codojo`
        2. Aller sur l'exercice...
        3. Faire...
        4. Voir l'erreur
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Composant concerné
      options:
        - CLI (`codojo`)
        - Portail Web
        - API
        - Autre
    validations:
      required: true
  - type: input
    id: cli-version
    attributes:
      label: Version du CLI (si applicable)
      placeholder: 'ex: 1.2.3 (obtenir avec `codojo --version`)'
  - type: dropdown
    id: os
    attributes:
      label: Système d'exploitation
      options:
        - Linux
        - macOS
        - Windows
  - type: textarea
    id: logs
    attributes:
      label: Logs ou messages d'erreur
      render: shell
