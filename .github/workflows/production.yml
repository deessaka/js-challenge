name: CI/CD Pipeline

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: codojo
          POSTGRES_PASSWORD: test-only-postgres-password
          POSTGRES_DB: codojo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm list --depth=0

      - name: Audit Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type Check
        run: npm run typecheck

      - name: Run Tests
        env:
          TZ: UTC
          PORT: 3333
          HOST: 127.0.0.1
          LOG_LEVEL: info
          DOMAIN: http://127.0.0.1:3333
          PUBLIC_APP_URL: http://127.0.0.1:3333
          APP_KEY: 'test-only-ci-key-000000000000000'
          NODE_ENV: test
          SESSION_DRIVER: memory
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: codojo
          DB_PASSWORD: test-only-postgres-password
          DB_DATABASE: codojo_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          GITHUB_CLIENT_ID: dummy
          GITHUB_CLIENT_SECRET: dummy
          SMTP_HOST: localhost
          SMTP_PORT: 587
          MAIL_DRIVER: resend
          RESEND_API_KEY: re_test_only_not_a_secret
        run: npm test

      - name: Build Application
        run: |
          echo "Building application..."
          npm run build
          if [ $? -ne 0 ]; then
            echo "Build failed"
            exit 1
          fi
          echo "Build completed successfully"

      - name: Verify Build
        run: |
          if [ ! -d "build" ]; then
            echo "Build directory is missing"
            exit 1
          fi

  cli-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Test and build CLI
        run: npm test
      - name: Verify package contents
        run: npm pack --dry-run

  deploy:
    needs: [test-and-build, cli-test-and-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    # Scopes this job to the "production" GitHub environment. To actually
    # require a manual approval before this job runs, configure required
    # reviewers on that environment under Settings > Environments > production
    # in the repo settings — this YAML alone does not gate anything until
    # reviewers are set there.
    environment: production
    steps:
      - name: Trigger Render Deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK_URL" || { echo "Missing deployment hook"; exit 1; }
          curl --fail --silent --show-error --max-time 30 \
            --request POST --output /dev/null "$DEPLOY_HOOK_URL"
