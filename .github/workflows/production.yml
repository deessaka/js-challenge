name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: codojo
          POSTGRES_PASSWORD: test-only-postgres-password
          POSTGRES_DB: codojo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm list --depth=0

      - name: Audit Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type Check
        run: npm run typecheck

      - name: Run Tests
        env:
          TZ: UTC
          PORT: 3333
          HOST: 127.0.0.1
          LOG_LEVEL: info
          DOMAIN: http://127.0.0.1:3333
          PUBLIC_APP_URL: http://127.0.0.1:3333
          APP_KEY: 'test-only-ci-key-000000000000000'
          NODE_ENV: test
          SESSION_DRIVER: memory
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: codojo
          DB_PASSWORD: test-only-postgres-password
          DB_DATABASE: codojo_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          GITHUB_CLIENT_ID: dummy
          GITHUB_CLIENT_SECRET: dummy
          SMTP_HOST: localhost
          SMTP_PORT: 587
          MAIL_DRIVER: resend
          RESEND_API_KEY: re_test_only_not_a_secret
        run: npm test

      - name: Build Application
        run: |
          echo "Building application..."
          npm run build
          if [ $? -ne 0 ]; then
            echo "Build failed"
            exit 1
          fi
          echo "Build completed successfully"

      - name: Build CLI
        working-directory: cli
        run: npm ci --ignore-scripts && npm run build

      - name: Verify Build
        run: |
          if [ ! -d "build" ]; then
            echo "Build directory is missing"
            exit 1
          fi
          if [ ! -f "cli/dist/main.js" ]; then
            echo "CLI build artifact is missing"
            exit 1
          fi

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Scopes this job to the "production" GitHub environment. To actually
    # require a manual approval before this job runs, configure required
    # reviewers on that environment under Settings > Environments > production
    # in the repo settings — this YAML alone does not gate anything until
    # reviewers are set there.
    environment: production
    steps:
      - name: Trigger Render Deployment
        run: |
          echo "Triggering Render deployment..."
          RESPONSE=$(curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            --max-time 30 \
            --silent \
            --show-error)

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo " Deployment triggered successfully!"
          else
            echo " Failed to trigger deployment. Status code: $HTTP_STATUS"
            exit 1
          fi
