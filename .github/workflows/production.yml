name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm list --depth=0

      - name: Type Check
        run: npm run typecheck

      - name: Run Tests
        env:
          TZ: ${{ secrets.TZ }}
          PORT: ${{ secrets.PORT }}
          HOST: ${{ secrets.HOST }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DOMAIN: ${{ secrets.DOMAIN }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          SESSION_DRIVER: ${{ secrets.SESSION_DRIVER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          ENV_PATH: ${{ secrets.ENV_PATH }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: npm test

      - name: Build Application
        run: |
          echo "Building application..."
          npm run build
          if [ $? -ne 0 ]; then
            echo "Build failed"
            exit 1
          fi
          echo "Build completed successfully"

      - name: Build CLI
        working-directory: cli
        run: npm ci --ignore-scripts && npm run build

      - name: Verify Build
        run: |
          if [ ! -d "build" ]; then
            echo "Build directory is missing"
            exit 1
          fi
          if [ ! -f "cli/dist/main.js" ]; then
            echo "CLI build artifact is missing"
            exit 1
          fi

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deployment
        run: |
          echo "Triggering Render deployment..."
          RESPONSE=$(curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }} \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            --max-time 30 \
            --silent)

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo " Deployment triggered successfully!"
          else
            echo " Failed to trigger deployment. Status code: $HTTP_STATUS"
            echo "Response: $BODY"
            exit 1
          fi
