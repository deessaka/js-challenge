name: Secret scan
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --max-time 60 "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location --max-time 60 "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output checksums.txt
          awk -v file="$archive" '$2 == file {print}' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar --no-same-owner -xzf "$archive" gitleaks
      - name: Scan new commits without exposing values
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --log-opts="$BASE_SHA..HEAD" .
          else
            "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact .
          fi
